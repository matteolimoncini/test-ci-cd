name: feature-deploy

on:
  workflow_dispatch:            # bottone "Run workflow": deploy on-demand da qualsiasi branch


jobs:
  deploy:
    name: Ephemeral deploy
    runs-on: ubuntu-latest
    steps:
      - name: Compute branch slug
        id: slug
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}   # head_ref: PR · ref_name: run manuale
        run: echo "slug=$(echo "$BRANCH" | tr '/' '_')" >> "$GITHUB_OUTPUT"
      - name: Mock deploy
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "MOCK ephemeral deploy -> prefix [${{ steps.slug.outputs.slug }}] (branch=$BRANCH)"
