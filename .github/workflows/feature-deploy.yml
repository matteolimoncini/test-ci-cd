name: feature-deploy

on:
  workflow_dispatch:            # bottone "Run workflow": deploy on-demand dal feature branch selezionato

# deploy e destroy dello stesso branch non girano in parallelo
# (stesso group di feature-cleanup)
concurrency:
  group: ephemeral-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Ephemeral deploy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce feature/* branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            feature/*) echo "Branch OK: $BRANCH" ;;
            *)
              echo "::error::feature-deploy si lancia solo da branch feature/* (attuale: $BRANCH)"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - name: Resolve target bundle
        id: meta
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          slug=$(echo "$BRANCH" | tr '/' '_' | tr '[:upper:]' '[:lower:]')
          project=$(echo "$BRANCH" | cut -d/ -f2)      # feature/<project>/<country>/<desc>
          country=$(echo "$BRANCH" | cut -d/ -f3)

          # lookup case-insensitive della dir country (branch 'es' vs dir 'ES')
          country_bundle=""
          if [ -d "packages/$project/countries" ]; then
            for d in "packages/$project/countries"/*/; do
              bn=$(basename "$d")
              if [ "$(echo "$bn" | tr '[:upper:]' '[:lower:]')" = "$(echo "$country" | tr '[:upper:]' '[:lower:]')" ]; then
                country_bundle="${d%/}/databricks.yml"
                break
              fi
            done
          fi
          project_bundle="packages/$project/databricks.yml"

          if [ -n "$country_bundle" ] && [ -f "$country_bundle" ]; then
            bundle="$country_bundle"; scope="country ($country)"
          else
            bundle="$project_bundle"; scope="project (shared)"
          fi
          {
            echo "slug=$slug"
            echo "project=$project"
            echo "country=$country"
            echo "bundle=$bundle"
            echo "bundle_dir=$(dirname "$bundle")"
            echo "scope=$scope"
          } >> "$GITHUB_OUTPUT"

      - name: Verify databricks.yml
        env:
          BUNDLE: ${{ steps.meta.outputs.bundle }}
          SCOPE:  ${{ steps.meta.outputs.scope }}
        run: |
          echo "Scope: $SCOPE"
          echo "databricks.yml atteso: $BUNDLE"
          if [ -f "$BUNDLE" ]; then
            echo "  -> trovato in: $(realpath "$BUNDLE")"
            echo "----- contenuto $BUNDLE -----"
            cat "$BUNDLE"
            echo "----- fine -----"
          else
            echo "  -> ERRORE: $BUNDLE non trovato" >&2
            exit 1
          fi

      - uses: databricks/setup-cli@main

      - name: Deploy ephemeral copy to dev
        working-directory: ${{ steps.meta.outputs.bundle_dir }}
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          echo "Ephemeral deploy: branch=${{ github.ref_name }} scope=${{ steps.meta.outputs.scope }} prefix=[$SLUG]"
          databricks bundle validate -t dev --var="branch=$SLUG"
          databricks bundle deploy   -t dev --var="branch=$SLUG"
