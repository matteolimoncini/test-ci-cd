name: feature-deploy

on:
  pull_request:
    types: [opened, synchronize]
    branches: [dev]

jobs:
  deploy:
    name: Ephemeral deploy
    runs-on: ubuntu-latest
    steps:
      - name: Compute branch slug
        id: slug
        run: echo "slug=$(echo '${{ github.head_ref }}' | tr '/' '_')" >> "$GITHUB_OUTPUT"
      - name: Mock deploy
        run: echo "MOCK ephemeral deploy -> prefix [${{ steps.slug.outputs.slug }}]"
