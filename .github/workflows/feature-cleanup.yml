name: feature-cleanup

on: delete

# stesso group di feature-deploy: destroy e deploy dello stesso branch non si sovrappongono
concurrency:
  group: ephemeral-${{ github.event.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Destroy ephemeral copy
    # solo branch (non tag) e solo feature/*
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'feature/')
    runs-on: ubuntu-latest
    steps:
      # il branch non esiste più: si risolve il bundle dalla versione su dev
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Resolve target bundle
        id: meta
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          slug=$(echo "$BRANCH" | tr '/' '_' | tr '[:upper:]' '[:lower:]')
          project=$(echo "$BRANCH" | cut -d/ -f2)      # feature/<project>/<country>/<desc>
          country=$(echo "$BRANCH" | cut -d/ -f3)

          # stessa risoluzione di feature-deploy: country case-insensitive, fallback sul bundle di progetto
          country_bundle=""
          if [ -d "packages/$project/countries" ]; then
            for d in "packages/$project/countries"/*/; do
              bn=$(basename "$d")
              if [ "$(echo "$bn" | tr '[:upper:]' '[:lower:]')" = "$(echo "$country" | tr '[:upper:]' '[:lower:]')" ]; then
                country_bundle="${d%/}/databricks.yml"
                break
              fi
            done
          fi
          project_bundle="packages/$project/databricks.yml"

          if [ -n "$country_bundle" ] && [ -f "$country_bundle" ]; then
            bundle="$country_bundle"; scope="country ($country)"
          elif [ -f "$project_bundle" ]; then
            bundle="$project_bundle"; scope="project (shared)"
          else
            echo "::notice::Nessun databricks.yml su dev per project=$project country=$country: niente da distruggere"
            bundle=""; scope="none"
          fi
          {
            echo "slug=$slug"
            echo "bundle=$bundle"
            echo "bundle_dir=$(dirname "${bundle:-.}")"
            echo "scope=$scope"
          } >> "$GITHUB_OUTPUT"

      - uses: databricks/setup-cli@main
        if: steps.meta.outputs.bundle != ''

      - name: Destroy ephemeral copy on dev
        if: steps.meta.outputs.bundle != ''
        working-directory: ${{ steps.meta.outputs.bundle_dir }}
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          echo "Destroy: branch=${{ github.event.ref }} scope=${{ steps.meta.outputs.scope }} prefix=[$SLUG]"
          databricks bundle destroy -t dev --var="branch=$SLUG" --auto-approve
