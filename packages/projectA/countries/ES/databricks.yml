# Databricks Asset Bundle - projectA
# Docs: https://docs.databricks.com/dev-tools/bundles/index.html
bundle:
  name: projectA

variables:
  notification_email:
    description: Email address used for job run notifications.
    default: data-team@example.com
  branch:
    description: Slug del branch usato come prefisso per i deploy effimeri.
    default: ""

# Simple resources deployed by this bundle
resources:
  jobs:
    projectA_sample_job:
      name: "[${bundle.target}][${var.branch}] projectA - sample job"
      tags:
        project: projectA
        managed_by: dab
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ./ingest.py
        - task_key: transform
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ./transform.py
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Rome
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${var.notification_email}

targets:
  dev:
    mode: development
    default: true
    presets:
      name_prefix: ""
    workspace:
      host: https://dbc-d01c4c3a-2fbf.cloud.databricks.com

  prod:
    mode: production
    presets:
      name_prefix: ""
    workspace:
      host: https://dbc-6fe91c27-e36a.cloud.databricks.com

